[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ticketto-ticket-service"
version = "0.1.0"
description = "Ticket issuance and check-in service for Ticketto"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "Flask>=3.1,<4.0",
  "gunicorn>=23.0,<24.0",
  "pika>=1.3,<2.0",
  "pydantic>=2.10,<3.0",
  "PyMySQL[rsa]>=1.1,<2.0",
  "segno>=1.6,<2.0",
  "SQLAlchemy>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
  "pylint>=4.1,<5",
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.16,<0.17",
]
# The contract tests' public dependencies. ticketto-contracts itself comes from a private
# registry: requirements-contract.txt.
contract = [
  "jsonschema>=4.23,<5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: needs MySQL, RabbitMQ, the API and the worker running (see README)",
  "contract: AMQP message contracts, from the ticketto-contracts package (see README)",
]
addopts = '-m "not integration"'

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]

[tool.pylint.main]
py-version = "3.12"
recursive = true
# Installed only for the contract tests (requirements-contract.txt), not in the pylint job.
ignored-modules = ["ticketto_contracts"]

[tool.pylint.imports]
known-third-party = ["alembic"]

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = [
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "redefined-outer-name",
  "too-few-public-methods",
]

[tool.coverage.run]
source = ["app"]

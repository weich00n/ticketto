[pytest]
testpaths = tests
markers =
    integration: needs the Docker Compose stack (user-service, mysql, cognito-local) running
    broker: also needs the shared broker and the worker (docker compose --profile worker up -d)
    contract: AMQP message contracts, from the ticketto-contracts package (see README)
# Unit tests only by default. Run the integration suite with: pytest -m integration,
# and the worker's end-to-end tests with: pytest -m broker
addopts = -m "not integration and not broker"

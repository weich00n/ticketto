# Test-only signing material. A profile-specific file is used so it adds to
# application.properties rather than replacing it.
#
# The suite signs its admission tokens with HMAC, which keeps the test helper to a few lines
# and commits no key material - a private key in the repository would trip the pipeline's own
# secret detection. The RS256 path that production uses is covered separately by
# Rs256AdmissionTokenTest, which generates a real keypair and signs with the private half.
reservation.admission-token-algorithm=HS256
reservation.admission-token-secret=test-only-admission-secret-not-used-anywhere-real

# Tests drive the sweep directly, so the timer must not fire underneath them.
reservation.expiry-sweep-seconds=86400
reservation.reconcile-seconds=86400

# No broker under test. The listeners never connect, and the tests call them and the outbox
# publisher directly (with a stand-in RabbitTemplate) instead.
spring.rabbitmq.listener.simple.auto-startup=false
reservation.outbox-publish-seconds=86400

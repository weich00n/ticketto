# Read by the Spring TestContext framework itself, before any test context exists.
#
# Never pause cached contexts. By default a cached context is paused when another test class
# takes over and restarted when it is reused, and the restart starts every Lifecycle bean,
# including the RabbitMQ listener containers that application-test.properties keeps switched
# off. A restarted listener finds no reservation-service.* queues on the test broker (only
# BrokerIntegrationTest loads them) and fails the context, so whichever class happened to reuse
# a paused context failed depending on test order.
spring.test.context.cache.pause=never

spring.application.name=reservation-service
server.port=8081

# Redis - the live state (availability counters, hold liveness, expiry timer)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Empty locally and in CI (no AUTH); on AWS it comes from the reservation-service/redis secret.
spring.data.redis.password=${REDIS_PASSWORD:}
# While Redis is known to be down, commands are refused at once (RedisClientConfig). This limit is
# the backstop for when it vanishes without the connection breaking: a request fails with 503
# after 5s instead of Lettuce's default 60s. Far above any real command (~1ms), so a slow Redis
# box or a 500-hold sweep batch never trips it.
spring.data.redis.timeout=${REDIS_TIMEOUT:5s}

# MySQL - the durable record (inventory totals, sold counts, hold rows, sale status)
# createDatabaseIfNotExist: on a fresh RDS instance the database is created on first start, as
# long as the DB user may create it; Flyway then creates its tables.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:reservation_db}?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
# The schema is owned by the Flyway migrations in db/migration. Hibernate only checks that it
# matches the entities, and refuses to start if it does not.
spring.jpa.hibernate.ddl-auto=validate
# Databases created by the old ddl-auto=update have the tables but no Flyway history: they are
# recorded as already at V1 (the baseline, which describes exactly that schema) and get V2 on.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Entities are never touched outside a service call, so the session closes with the request.
spring.jpa.open-in-view=false
# Every timestamp is stored and read as UTC (Technical Contract section 2)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JSON shape (Technical Contract section 2): snake_case keys, no nulls, no data envelope,
# ISO-8601 instants such as 2026-11-20T12:00:00Z
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=non_null
spring.jackson.datatype.datetime.write-dates-as-timestamps=false

# Reservation rules. payment_expires_at is what the buyer sees; the Redis hold key lives one
# minute longer as the contract's processing buffer.
reservation.hold-ttl-minutes=${HOLD_TTL_MINUTES:6}
reservation.payment-deadline-minutes=${PAYMENT_DEADLINE_MINUTES:5}
reservation.max-tickets-per-user=${MAX_TICKETS_PER_USER:5}
reservation.expiry-sweep-seconds=${EXPIRY_SWEEP_SECONDS:10}
# How often the MySQL hold records are checked for holds the sweep can no longer reach.
reservation.reconcile-seconds=${RECONCILE_SECONDS:60}
# One thread per scheduled job (expiry sweep, reconciliation, outbox publishing). Spring's default
# is a single shared thread, so a publish stuck waiting on a slow broker would hold up expiries.
spring.task.scheduling.pool.size=3
# The admission token Queue issues. Queue signs it with its private key and we verify with the
# public half, so this service holds nothing that could mint a token.
#
# The algorithm is chosen here, never by the token itself: a token whose own header asks for a
# different algorithm is refused. RS256 is the default so a deployment that forgets to set it
# cannot quietly fall back to the shared-secret path; the service refuses to start without the
# key material for whichever algorithm is configured.
#
# ADMISSION_TOKEN_PUBLIC_KEY takes Queue's public key in PEM form. For local runs,
# scripts/dev-admission-keypair.sh generates a throwaway pair and prints both env vars.
reservation.admission-token-algorithm=${ADMISSION_TOKEN_ALGORITHM:RS256}
reservation.admission-token-secret=${ADMISSION_TOKEN_SECRET:}
reservation.admission-token-public-key=${ADMISSION_TOKEN_PUBLIC_KEY:}

# RabbitMQ - the shared Ticketto broker, whose topology rabbitmq-service owns. RABBITMQ_URL is
# the whole amqp:// URL; on AWS it is injected from the rabibi/service/reservation-service secret's url key. A URL
# without credentials uses RABBITMQ_USERNAME / RABBITMQ_PASSWORD, which default to the local
# broker's login from rabbitmq-service's docker compose.
reservation.rabbitmq-url=${RABBITMQ_URL:amqp://localhost:5672/%2F}
spring.rabbitmq.username=${RABBITMQ_USERNAME:ticketto}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:ticketto-local}
# Publishing (rabbitmq-service docs/MESSAGING.md): an outbox row is marked sent only once the
# broker confirms it, and mandatory asks the broker to say if it could not route a message.
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
reservation.outbox-publish-seconds=${OUTBOX_PUBLISH_SECONDS:1}
# Consuming: acknowledged once the listener returns (not AMQP auto-ack, which loses a message
# on a crash), a few retries in-process, then rejected without requeue into our dead-letter
# queue. The queues are the broker's; refuse to start if ours are missing rather than run deaf.
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.prefetch=10
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.missing-queues-fatal=true
spring.rabbitmq.listener.simple.retry.enabled=true
# max-retries, not the max-attempts in rabbitmq-service's docs: Boot 4 removed max-attempts and
# ignores it. Two retries is three attempts, which is what those docs intend.
spring.rabbitmq.listener.simple.retry.max-retries=2
spring.rabbitmq.listener.simple.retry.initial-interval=1s

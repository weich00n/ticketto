# Ticketto broker settings. Installed as /etc/rabbitmq/conf.d/20-ticketto.conf, after the
# official image's 10-defaults.conf (console logging). Comments must be on their own lines.
# Reference: https://www.rabbitmq.com/docs/configure

# ---- topology and users ----
# Every .json file in this directory is imported at each boot, in name order:
#   10-topology.json  baked into the image from topology/definitions.json
#   20-users.json     written by docker-entrypoint-ticketto.sh from environment variables
# Because definitions are imported, RabbitMQ does not create the default `guest` user.
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions

# ---- resource limits ----
# The EC2 broker host is a t4g.small (2 GiB) shared with two Redis containers, and the
# RabbitMQ data volume is 10 GiB. Above the memory watermark or below the free-disk limit
# RabbitMQ blocks publishers (they wait) instead of crashing.
vm_memory_high_watermark.absolute = 768MiB
disk_free_limit.absolute = 1GiB

# ---- acknowledgements ----
# A consumer holding an unacknowledged message longer than 30 minutes has its channel
# closed and the message is redelivered, so a hung consumer can't sit on work forever.
consumer_timeout = 1800000

# ---- management UI and metrics (private network only; reach them via SSM port forwarding) ----
management.tcp.port = 15672
prometheus.tcp.port = 15692

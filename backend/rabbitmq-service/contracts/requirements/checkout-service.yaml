# Payload fields checkout-service reads, per message it consumes. Owned by checkout-service.
# Each path must be required in the publisher's schema (tests/static/test_contracts.py).
# Paths: `field`, `object.field`, `array[].field`.
EventCancelled:
  - event_id
  - event_version
  - cancellation_id
  - cancelled_at
  - reason
ReservationExpired:
  - hold_id
  - admission_id
  - user_id
  - event_id
  - category_id
  - quantity
  - expired_at
RefundRequired:
  - hold_id
  - order_id
  - user_id
  - event_id
  - total_amount
  - currency
  - reason
  - required_at

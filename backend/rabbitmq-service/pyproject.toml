[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ticketto-rabbitmq-service"
version = "0.1.0"
description = "Ticketto's RabbitMQ broker: topology, configuration and the tests that prove it routes"
requires-python = ">=3.12"
# The broker itself is a container image; Python is only used for tooling and tests.
dependencies = [
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23,<5",
  "pika>=1.3,<2.0",
  "pylint>=4.1,<5",
  "pytest>=8.3,<10",
  "requests>=2.32,<3",
  "ruff>=0.16,<0.17",
  "testcontainers>=4.10,<5",
]

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "integration: starts the real broker image in Docker (needs a running Docker daemon)",
]
# Static tests only by default. Run the integration suite with: pytest -m integration
addopts = '-m "not integration"'

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, pyupgrade
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["tools", "tests"]

[tool.pylint.main]
py-version = "3.12"

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
disable = [
  "missing-module-docstring",
  "missing-class-docstring",
  "missing-function-docstring",
  "redefined-outer-name",   # every pytest fixture used as an argument triggers it
  "too-few-public-methods", # small classes (dataclasses) are fine
]
